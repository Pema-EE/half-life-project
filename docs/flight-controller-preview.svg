  <g>
    <path d="M300 130 L300 170" class="wire2"/>
    <path d="M300 530 L300 610" class="wire2"/>
    <path d="M850 200 L850 260" class="wire2"/>
    <path d="M300 170 L200 170 L200 570 L300 570" class="wire2"/>
    <path d="M850 430 L850 560 L700 560" class="wire2"/>
  </g>

  <g>
    <text x="535" y="88" class="title">Flight Controller Schematic Preview</text>
    <text x="535" y="116" class="small">ESP32 + MPU-6050 design concept</text>
  </g>
